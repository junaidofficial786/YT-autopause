<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT AutoPause</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- ─── Header ─────────────────────────────────────────────────────── -->
    <header class="header">
      <div class="header-left">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Play/Pause hybrid icon -->
            <rect x="2" y="2" width="24" height="24" rx="6" fill="url(#logoGrad)" />
            <!-- Pause bars -->
            <rect x="9" y="8" width="3.5" height="12" rx="1" fill="white" opacity="0.95"/>
            <rect x="15.5" y="8" width="3.5" height="12" rx="1" fill="white" opacity="0.95"/>
            <defs>
              <linearGradient id="logoGrad" x1="2" y1="2" x2="26" y2="26" gradientUnits="userSpaceOnUse">
                <stop stop-color="#FF4444"/>
                <stop offset="1" stop-color="#CC0000"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="header-text">
          <h1 class="app-title">YT AutoPause</h1>
          <span class="app-version">v1.0</span>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggle" title="Toggle theme">
        <svg class="theme-icon sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="theme-icon moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </header>

    <!-- ─── Divider ────────────────────────────────────────────────────── -->
    <div class="divider"></div>

    <!-- ─── Main Toggle Section ────────────────────────────────────────── -->
    <section class="toggle-section">
      <div class="toggle-visual">
        <div class="toggle-glow" id="toggleGlow"></div>
        <label class="toggle-switch" for="mainToggle">
          <input type="checkbox" id="mainToggle" checked>
          <span class="toggle-slider">
            <span class="toggle-knob">
              <!-- Play icon (shown when OFF) -->
              <svg class="knob-icon icon-play" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5,3 19,12 5,21"/>
              </svg>
              <!-- Pause icon (shown when ON) -->
              <svg class="knob-icon icon-pause" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <rect x="5" y="3" width="4" height="18" rx="1"/>
                <rect x="15" y="3" width="4" height="18" rx="1"/>
              </svg>
            </span>
          </span>
        </label>
      </div>

      <div class="toggle-label" id="toggleLabel">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">Auto-pause is ON</span>
      </div>
    </section>

    <!-- ─── Info Card ──────────────────────────────────────────────────── -->
    <section class="info-card" id="infoCard">
      <p class="info-text" id="infoText">
        YouTube will <strong>automatically pause</strong> when you switch tabs and <strong>resume</strong> when you return.
      </p>
    </section>

    <!-- ─── Features / Settings (Expandable) ───────────────────────────── -->
    <section class="settings-section">
      <button class="settings-header" id="settingsToggle">
        <div class="settings-header-left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span>Settings</span>
        </div>
        <svg class="chevron" id="settingsChevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <div class="settings-body" id="settingsBody">
        <div class="setting-item">
          <div class="setting-info">
            <span class="setting-label">Pause delay</span>
            <span class="setting-desc">Wait before pausing (coming soon)</span>
          </div>
          <span class="coming-soon-badge">Soon</span>
        </div>
        <div class="setting-item">
          <div class="setting-info">
            <span class="setting-label">Whitelist tabs</span>
            <span class="setting-desc">Only apply on specific tabs (coming soon)</span>
          </div>
          <span class="coming-soon-badge">Soon</span>
        </div>
      </div>
    </section>

    <!-- ─── Footer ─────────────────────────────────────────────────────── -->
    <footer class="footer">
      <span class="footer-text">Works on all YouTube video pages</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
